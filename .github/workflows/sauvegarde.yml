# La copie qui ne vit pas chez Supabase.
#
# Le plan Pro sauvegarde déjà la base tous les jours et les garde sept jours.
# Ces sauvegardes-là protègent d'une bêtise de notre côté : une migration
# ratée, un `delete` trop large, un travail de nuit qui déraille. Elles ne
# protègent de rien du tout si le problème vient de Supabase — compte
# suspendu, facture qui passe mal, incident chez eux — parce qu'elles sont
# rangées au même endroit que ce qu'elles sauvegardent.
#
# D'où ce fichier : une copie par nuit, chiffrée, déposée chez un autre
# hébergeur, sur un autre compte, payé séparément.
#
# TROIS CHOIX QUI NE SONT PAS DES DÉTAILS
#
# 1. **2 h 30 UTC, et pas plus tard.** Les travaux de nuit tournent de 3 h à
#    4 h 45 (`supabase/planification.sql`) et SUPPRIMENT des lignes : purge de
#    l'historique, des tentatives de rattachement, des appareils orphelins,
#    des conversations. Une sauvegarde prise après eux contient déjà les
#    dégâts le jour où l'un d'eux se trompe. Elle passe donc avant.
#
# 2. **Les conversations du compagnon ne partent pas.** La politique de
#    confidentialité promet « 30 jours, puis effacement automatique », et
#    `companion.sql:139` le tient. Une sauvegarde qui les garde plus longtemps
#    fait mentir la politique. `--exclude-table-data` laisse donc la table
#    dans le schéma et son contenu dehors — restaurer rend une base complète
#    et des conversations vides, ce qui est le comportement voulu.
#
# 3. **Chiffrement asymétrique.** La clé PUBLIQUE est dans le dépôt, la clé
#    PRIVÉE n'est nulle part ici. Conséquence : quelqu'un qui prendrait la
#    main sur GitHub *et* sur o2switch ne pourrait lire aucune sauvegarde. Le
#    revers est entier — SANS LA CLÉ PRIVÉE, CES FICHIERS NE VALENT RIEN.
#    Elle se garde hors ligne, sur papier. Voir `docs/ops/sauvegardes.md`.

name: Sauvegarde hors-Supabase

on:
  schedule:
    # 2 h 30 UTC, tous les jours. Avant les travaux de nuit (voir ci-dessus).
    - cron: '30 2 * * *'
  # Pour la lancer à la main le jour où on veut vérifier qu'elle marche
  # encore — et c'est ce qu'on fera après chaque changement de ce fichier.
  workflow_dispatch:

concurrency:
  group: sauvegarde
  cancel-in-progress: false

jobs:
  sauvegarder:
    name: Vider, chiffrer, déposer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # `pg_dump` doit être d'une version au moins égale à celle du serveur —
      # Supabase tourne en 17.6, un client 16 REFUSE de lui parler et s'arrête.
      #
      # **Installer le bon paquet ne suffit pas, et c'est ce qui a échoué au
      # premier passage.** Sur Ubuntu, `/usr/bin/pg_dump` n'est pas un binaire
      # mais une enveloppe de `postgresql-client-common` qui choisit elle-même
      # une version parmi celles présentes. Le runner en embarque déjà une, et
      # c'est elle qui l'emportait : le journal disait « pg_dump version:
      # 16.15 » alors que le 17 venait d'être installé.
      #
      # On met donc le chemin versionné en TÊTE du PATH pour les étapes
      # suivantes, au lieu de s'en remettre à l'enveloppe.
      - name: Installer pg_dump et age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      # La garde qui manquait. `$GITHUB_PATH` ne prend effet qu'à l'étape
      # SUIVANTE : c'est donc ici, et pas plus haut, qu'on peut vérifier ce que
      # `pg_dump` résout réellement. Sans elle, une version trop ancienne ne se
      # découvrait qu'au moment de vider la base — et une version trop récente
      # côté serveur, le jour où Supabase met à jour, ne se découvrirait qu'une
      # nuit, en silence.
      - name: Vérifier que c’est bien le pg_dump 17 qui répond
        run: |
          echo "pg_dump résolu : $(command -v pg_dump)"
          pg_dump --version
          case "$(pg_dump --version)" in
            *" 17."*) echo "version 17 : ok" ;;
            *) echo "::error::pg_dump n'est pas en 17. Si Supabase a changé de version majeure, corriger postgresql-client-17 dans ce fichier." ; exit 1 ;;
          esac

      # Le placeholder qui traîne est le défaut le plus bête possible : la
      # sauvegarde tournerait, chiffrerait vers une clé que personne ne
      # possède, et on ne s'en apercevrait que le jour de la restauration.
      - name: Vérifier la clé publique
        run: |
          CLE=".github/sauvegarde.age.pub"
          if ! test -s "$CLE"; then
            echo "::error::$CLE est absent ou vide."
            exit 1
          fi
          if grep -q "REMPLACER" "$CLE"; then
            echo "::error::$CLE contient encore le texte d'exemple."
            echo "Générez la paire de clés : voir docs/ops/sauvegardes.md"
            exit 1
          fi
          grep -qE '^age1[0-9a-z]{20,}$' "$CLE" || {
            echo "::error::$CLE ne ressemble pas à une clé publique age."
            exit 1
          }

      # `public` ET `auth` : les deux, et c'est le point qui fait échouer les
      # restaurations mal préparées. `parents.user_id` et
      # `family_devices.user_id` pointent vers `auth.users` — une copie du
      # seul schéma `public` rend une base dont plus personne ne peut se
      # connecter, et dont chaque appareil rattaché est orphelin.
      - name: Vider la base
        env:
          PGCONNECT_TIMEOUT: '30'
        run: |
          set -o pipefail
          HORODATAGE=$(date -u +%Y-%m-%dT%H%M)
          echo "HORODATAGE=$HORODATAGE" >> "$GITHUB_ENV"
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --schema=public \
            --schema=auth \
            --exclude-table-data='public.companion_messages' \
            --no-owner \
            --no-privileges \
            --quote-all-identifiers \
            --format=custom \
            --compress=9 \
            --file="mino-$HORODATAGE.dump"
          ls -l "mino-$HORODATAGE.dump"

      # Un `pg_dump` interrompu rend un fichier court sans toujours sortir en
      # erreur. Sans ce garde-fou, on déposerait des fichiers tronqués nuit
      # après nuit en croyant être couvert — le genre de vert qui ne prouve
      # rien contre lequel tout ce dépôt est écrit.
      - name: Refuser un fichier anormalement court
        run: |
          TAILLE=$(stat -c%s "mino-$HORODATAGE.dump")
          echo "Taille : $TAILLE octets"
          if [ "$TAILLE" -lt 51200 ]; then
            echo "::error::Le fichier fait moins de 50 Ko : ce n'est pas une base de familles."
            exit 1
          fi
          echo "TAILLE=$TAILLE" >> "$GITHUB_ENV"

      - name: Chiffrer
        run: |
          age --encrypt --recipient "$(cat .github/sauvegarde.age.pub)" \
            --output "mino-$HORODATAGE.dump.age" \
            "mino-$HORODATAGE.dump"
          rm -f "mino-$HORODATAGE.dump"
          ls -l "mino-$HORODATAGE.dump.age"

      # **Cette étape a échoué au deuxième passage, et elle s'était bâillonnée
      # elle-même** : un `2>/dev/null` sur `ssh-keyscan` jetait précisément le
      # message qui aurait dit pourquoi. Un garde-fou muet ne garde rien.
      #
      # Elle est réécrite sur trois principes :
      #   — les secrets passent par `env:` et non par interpolation directe,
      #     ce qui permet de tester qu'ils existent sans jamais les afficher ;
      #   — chaque manque est NOMMÉ : on ne cherche pas lequel des six ;
      #   — `ssh-keyscan` disparaît au profit de `StrictHostKeyChecking=
      #     accept-new` sur les appels eux-mêmes. Même niveau de confiance — on
      #     accepte la clé présentée au premier contact dans les deux cas — mais
      #     une pièce mobile en moins, et l'erreur remonte là où elle se produit.
      - name: Préparer l’accès à o2switch
        env:
          CLE: ${{ secrets.O2SWITCH_SSH_KEY }}
          HOTE: ${{ secrets.O2SWITCH_HOST }}
          UTILISATEUR: ${{ secrets.O2SWITCH_USER }}
          PORT: ${{ secrets.O2SWITCH_PORT }}
          DEST: ${{ secrets.O2SWITCH_PATH }}
        run: |
          manque=0
          [ -n "$HOTE" ]        || { echo "::error::Secret O2SWITCH_HOST vide ou absent."; manque=1; }
          [ -n "$UTILISATEUR" ] || { echo "::error::Secret O2SWITCH_USER vide ou absent."; manque=1; }
          [ -n "$PORT" ]        || { echo "::error::Secret O2SWITCH_PORT vide ou absent."; manque=1; }
          [ -n "$DEST" ]        || { echo "::error::Secret O2SWITCH_PATH vide ou absent."; manque=1; }
          [ -n "$CLE" ]         || { echo "::error::Secret O2SWITCH_SSH_KEY vide ou absent."; manque=1; }
          [ "$manque" = 0 ] || exit 1
          echo "les cinq secrets o2switch sont présents"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Une clé collée sans ses lignes BEGIN/END est le défaut le plus
          # courant, et SSH n'en dit qu'un « Permission denied » sans indice.
          head -1 ~/.ssh/id_ed25519 | grep -q 'BEGIN OPENSSH PRIVATE KEY' || {
            echo "::error::O2SWITCH_SSH_KEY ne commence pas par -----BEGIN OPENSSH PRIVATE KEY----- . Recoller le fichier ENTIER (pbcopy < ~/mino-o2switch)."
            exit 1
          }
          grep -q 'END OPENSSH PRIVATE KEY' ~/.ssh/id_ed25519 || {
            echo "::error::O2SWITCH_SSH_KEY n'a pas sa ligne -----END OPENSSH PRIVATE KEY----- . La clé est tronquée."
            exit 1
          }
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || {
            echo "::error::La clé est présente mais illisible : contenu abîmé au copier-coller."
            exit 1
          }
          echo "clé complète et lisible"

          # Connexion d'essai, stderr VISIBLE cette fois.
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "$UTILISATEUR@$HOTE" "echo 'connexion o2switch : ok'"

      # Le dossier de dépôt est HORS de public_html. Un `.dump` posé sous une
      # racine web est téléchargeable par qui devine son nom : c'est la façon
      # la plus banale de perdre une base entière, et le chiffrement ne serait
      # plus alors que la dernière ligne de défense au lieu d'être la seconde.
      - name: Déposer
        env:
          HOTE: ${{ secrets.O2SWITCH_HOST }}
          UTILISATEUR: ${{ secrets.O2SWITCH_USER }}
          PORT: ${{ secrets.O2SWITCH_PORT }}
          DEST: ${{ secrets.O2SWITCH_PATH }}
        run: |
          case "$DEST" in
            *public_html*)
              echo "::error::O2SWITCH_PATH est sous public_html : le fichier serait téléchargeable par qui devine son nom."
              exit 1 ;;
          esac
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "$UTILISATEUR@$HOTE" "mkdir -p '$DEST' && chmod 700 '$DEST'"
          scp -i ~/.ssh/id_ed25519 -P "$PORT" -o StrictHostKeyChecking=accept-new \
            "mino-$HORODATAGE.dump.age" \
            "$UTILISATEUR@$HOTE:$DEST/"

      # On relit ce qu'on vient d'écrire. Un `scp` qui rend 0 sur un disque
      # plein existe ; un fichier déposé à moitié aussi.
      - name: Relire depuis le serveur
        env:
          HOTE: ${{ secrets.O2SWITCH_HOST }}
          UTILISATEUR: ${{ secrets.O2SWITCH_USER }}
          PORT: ${{ secrets.O2SWITCH_PORT }}
          DEST: ${{ secrets.O2SWITCH_PATH }}
        run: |
          DISTANTE=$(ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "$UTILISATEUR@$HOTE" "stat -c%s '$DEST/mino-$HORODATAGE.dump.age'")
          LOCALE=$(stat -c%s "mino-$HORODATAGE.dump.age")
          echo "local : $LOCALE — distant : $DISTANTE"
          if [ "$DISTANTE" != "$LOCALE" ]; then
            echo "::error::Le fichier déposé ne fait pas la même taille que l'original."
            exit 1
          fi

      # 30 jours, et pas plus. La politique de confidentialité promet
      # l'effacement des profils enfants « immédiat et définitif » à la
      # suppression d'un compte : une sauvegarde qui vivrait des mois
      # rendrait cette phrase fausse. 30 jours est aussi la plus courte des
      # promesses de conservation, ce qui rend la règle simple à tenir.
      - name: Purger au-delà de 30 jours
        env:
          HOTE: ${{ secrets.O2SWITCH_HOST }}
          UTILISATEUR: ${{ secrets.O2SWITCH_USER }}
          PORT: ${{ secrets.O2SWITCH_PORT }}
          DEST: ${{ secrets.O2SWITCH_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "$UTILISATEUR@$HOTE" \
            "find '$DEST' -name 'mino-*.dump.age' -type f -mtime +30 -print -delete"

      - name: Compter ce qui reste
        env:
          HOTE: ${{ secrets.O2SWITCH_HOST }}
          UTILISATEUR: ${{ secrets.O2SWITCH_USER }}
          PORT: ${{ secrets.O2SWITCH_PORT }}
          DEST: ${{ secrets.O2SWITCH_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "$UTILISATEUR@$HOTE" \
            "ls -1 '$DEST'/mino-*.dump.age | wc -l | xargs echo 'Sauvegardes présentes :'"

      - name: Effacer la clé du runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519
