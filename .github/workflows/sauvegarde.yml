# La copie qui ne vit pas chez Supabase.
#
# Le plan Pro sauvegarde déjà la base tous les jours et les garde sept jours.
# Ces sauvegardes-là protègent d'une bêtise de notre côté : une migration
# ratée, un `delete` trop large, un travail de nuit qui déraille. Elles ne
# protègent de rien du tout si le problème vient de Supabase — compte
# suspendu, facture qui passe mal, incident chez eux — parce qu'elles sont
# rangées au même endroit que ce qu'elles sauvegardent.
#
# D'où ce fichier : une copie par nuit, chiffrée, déposée chez un autre
# fournisseur, sur un autre compte.
#
# **POURQUOI CLOUDFLARE R2 ET NON o2switch**, puisque c'est l'hébergement déjà
# payé. Parce que le pare-feu d'o2switch bloque SSH par défaut et n'ouvre que
# des adresses IP nommément autorisées, sur demande au support. Les runners
# GitHub tournent sur des milliers de plages Azure qui changent sans préavis :
# il n'y a aucune adresse fixe à faire autoriser. Essayé, et le journal l'a dit
# sans ambiguïté — « Connection timed out » depuis le runner, alors que la même
# clé ouvrait la session depuis le Mac. Ce n'était pas un réglage à trouver,
# c'était une impasse.
#
# R2 est joignable de partout, ses 10 Go gratuits couvrent mille fois nos
# besoins — un dump fait 274 Ko, trente jours pèsent 8 Mo — et c'est un
# fournisseur distinct de Supabase, ce qui est tout l'objet de l'exercice.
#
# TROIS CHOIX QUI NE SONT PAS DES DÉTAILS
#
# 1. **2 h 30 UTC, et pas plus tard.** Les travaux de nuit tournent de 3 h à
#    4 h 45 (`supabase/planification.sql`) et SUPPRIMENT des lignes : purge de
#    l'historique, des tentatives de rattachement, des appareils orphelins,
#    des conversations. Une sauvegarde prise après eux contient déjà les
#    dégâts le jour où l'un d'eux se trompe. Elle passe donc avant.
#
# 2. **Les conversations du compagnon ne partent pas.** La politique de
#    confidentialité promet « 30 jours, puis effacement automatique », et
#    `companion.sql:139` le tient. Une sauvegarde qui les garde plus longtemps
#    fait mentir la politique. `--exclude-table-data` laisse donc la table
#    dans le schéma et son contenu dehors — restaurer rend une base complète
#    et des conversations vides, ce qui est le comportement voulu.
#
# 3. **Chiffrement asymétrique.** La clé PUBLIQUE est dans le dépôt, la clé
#    PRIVÉE n'est nulle part ici. Conséquence : quelqu'un qui prendrait la
#    main sur GitHub *et* sur Cloudflare ne pourrait lire aucune sauvegarde. Le
#    revers est entier — SANS LA CLÉ PRIVÉE, CES FICHIERS NE VALENT RIEN.
#    Elle se garde hors ligne, sur papier. Voir `docs/ops/sauvegardes.md`.

name: Sauvegarde hors-Supabase

on:
  schedule:
    # 2 h 30 UTC, tous les jours. Avant les travaux de nuit (voir ci-dessus).
    - cron: '30 2 * * *'
  # Pour la lancer à la main le jour où on veut vérifier qu'elle marche
  # encore — et c'est ce qu'on fera après chaque changement de ce fichier.
  workflow_dispatch:

concurrency:
  group: sauvegarde
  cancel-in-progress: false

jobs:
  sauvegarder:
    name: Vider, chiffrer, déposer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # `pg_dump` doit être d'une version au moins égale à celle du serveur —
      # Supabase tourne en 17.6, un client 16 REFUSE de lui parler et s'arrête.
      #
      # **Installer le bon paquet ne suffit pas, et c'est ce qui a échoué au
      # premier passage.** Sur Ubuntu, `/usr/bin/pg_dump` n'est pas un binaire
      # mais une enveloppe de `postgresql-client-common` qui choisit elle-même
      # une version parmi celles présentes. Le runner en embarque déjà une, et
      # c'est elle qui l'emportait : le journal disait « pg_dump version:
      # 16.15 » alors que le 17 venait d'être installé.
      #
      # On met donc le chemin versionné en TÊTE du PATH pour les étapes
      # suivantes, au lieu de s'en remettre à l'enveloppe.
      - name: Installer pg_dump et age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      # La garde qui manquait. `$GITHUB_PATH` ne prend effet qu'à l'étape
      # SUIVANTE : c'est donc ici, et pas plus haut, qu'on peut vérifier ce que
      # `pg_dump` résout réellement. Sans elle, une version trop ancienne ne se
      # découvrait qu'au moment de vider la base — et une version trop récente
      # côté serveur, le jour où Supabase met à jour, ne se découvrirait qu'une
      # nuit, en silence.
      - name: Vérifier que c’est bien le pg_dump 17 qui répond
        run: |
          echo "pg_dump résolu : $(command -v pg_dump)"
          pg_dump --version
          case "$(pg_dump --version)" in
            *" 17."*) echo "version 17 : ok" ;;
            *) echo "::error::pg_dump n'est pas en 17. Si Supabase a changé de version majeure, corriger postgresql-client-17 dans ce fichier." ; exit 1 ;;
          esac

      # Le placeholder qui traîne est le défaut le plus bête possible : la
      # sauvegarde tournerait, chiffrerait vers une clé que personne ne
      # possède, et on ne s'en apercevrait que le jour de la restauration.
      - name: Vérifier la clé publique
        run: |
          CLE=".github/sauvegarde.age.pub"
          if ! test -s "$CLE"; then
            echo "::error::$CLE est absent ou vide."
            exit 1
          fi
          if grep -q "REMPLACER" "$CLE"; then
            echo "::error::$CLE contient encore le texte d'exemple."
            echo "Générez la paire de clés : voir docs/ops/sauvegardes.md"
            exit 1
          fi
          grep -qE '^age1[0-9a-z]{20,}$' "$CLE" || {
            echo "::error::$CLE ne ressemble pas à une clé publique age."
            exit 1
          }

      # `public` ET `auth` : les deux, et c'est le point qui fait échouer les
      # restaurations mal préparées. `parents.user_id` et
      # `family_devices.user_id` pointent vers `auth.users` — une copie du
      # seul schéma `public` rend une base dont plus personne ne peut se
      # connecter, et dont chaque appareil rattaché est orphelin.
      - name: Vider la base
        env:
          PGCONNECT_TIMEOUT: '30'
        run: |
          set -o pipefail
          HORODATAGE=$(date -u +%Y-%m-%dT%H%M)
          echo "HORODATAGE=$HORODATAGE" >> "$GITHUB_ENV"
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --schema=public \
            --schema=auth \
            --exclude-table-data='public.companion_messages' \
            --no-owner \
            --no-privileges \
            --quote-all-identifiers \
            --format=custom \
            --compress=9 \
            --file="mino-$HORODATAGE.dump"
          ls -l "mino-$HORODATAGE.dump"

      # Un `pg_dump` interrompu rend un fichier court sans toujours sortir en
      # erreur. Sans ce garde-fou, on déposerait des fichiers tronqués nuit
      # après nuit en croyant être couvert — le genre de vert qui ne prouve
      # rien contre lequel tout ce dépôt est écrit.
      - name: Refuser un fichier anormalement court
        run: |
          TAILLE=$(stat -c%s "mino-$HORODATAGE.dump")
          echo "Taille : $TAILLE octets"
          if [ "$TAILLE" -lt 51200 ]; then
            echo "::error::Le fichier fait moins de 50 Ko : ce n'est pas une base de familles."
            exit 1
          fi
          echo "TAILLE=$TAILLE" >> "$GITHUB_ENV"

      - name: Chiffrer
        run: |
          age --encrypt --recipient "$(cat .github/sauvegarde.age.pub)" \
            --output "mino-$HORODATAGE.dump.age" \
            "mino-$HORODATAGE.dump"
          rm -f "mino-$HORODATAGE.dump"
          ls -l "mino-$HORODATAGE.dump.age"

      # Cloudflare R2 parle le protocole S3 : l'outil `aws`, déjà présent sur le
      # runner, suffit. Aucune action tierce à qui confier des identifiants —
      # une action de dépôt est du code que l'on n'a pas lu et qui voit passer
      # la sauvegarde entière.
      - name: Déposer sur Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          POINT: ${{ secrets.R2_ENDPOINT }}
          SEAU: ${{ secrets.R2_BUCKET }}
        run: |
          manque=0
          [ -n "$AWS_ACCESS_KEY_ID" ]     || { echo "::error::Secret R2_ACCESS_KEY_ID vide ou absent."; manque=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::Secret R2_SECRET_ACCESS_KEY vide ou absent."; manque=1; }
          [ -n "$POINT" ]                 || { echo "::error::Secret R2_ENDPOINT vide ou absent."; manque=1; }
          [ -n "$SEAU" ]                  || { echo "::error::Secret R2_BUCKET vide ou absent."; manque=1; }
          [ "$manque" = 0 ] || exit 1
          echo "les quatre secrets R2 sont présents"

          # Cloudflare affiche l'adresse S3 AVEC le nom du seau à la fin, et un
          # copier-coller y ajoute volontiers une espace ou une fin de ligne.
          # Ce sont trois variantes normales : on les absorbe au lieu de les
          # refuser. Une garde qui rejette ce qu'elle pourrait corriger fait
          # perdre un aller-retour pour rien — celle-ci l'a fait une fois.
          POINT=$(printf '%s' "$POINT" | tr -d '[:space:]')
          POINT=${POINT%/}
          POINT=${POINT%/$SEAU}
          POINT=${POINT%/}

          # **La résidence européenne est une phrase publiée**, et rien ne la
          # vérifiait. La politique annonce aux parents que la copie reste dans
          # l'Union ; c'est la juridiction du seau qui l'engage, et elle se
          # lit dans l'adresse — un seau en juridiction European Union répond
          # sur `<compte>.eu.r2.cloudflarestorage.com`.
          #
          # Un avertissement et non un échec, pour l'instant : une sauvegarde
          # qui s'arrête est pire qu'une sauvegarde à vérifier. À durcir dès
          # que l'adresse aura été constatée.
          case "$POINT" in
            https://*.eu.r2.cloudflarestorage.com)
              echo "adresse R2 reconnue, juridiction européenne" ;;
            https://*.r2.cloudflarestorage.com)
              echo "::warning::L'adresse R2 ne porte pas « .eu. » : le seau n'est peut-être pas en juridiction European Union, alors que la politique de confidentialité annonce aux parents que les sauvegardes restent dans l'Union. À vérifier dans les réglages du seau."
              echo "adresse R2 reconnue" ;;
            *)
              echo "::error::R2_ENDPOINT n'a pas la forme attendue. Cloudflare en donne une du genre https://<compte>.r2.cloudflarestorage.com — ou https://<compte>.eu.r2.cloudflarestorage.com en juridiction européenne."
              echo "Reçu, après nettoyage : $(printf '%s' "$POINT" | wc -c) caractères, commençant par « $(printf '%s' "$POINT" | cut -c1-8) »."
              exit 1 ;;
          esac
          echo "POINT=$POINT" >> "$GITHUB_ENV"

          aws s3 cp "mino-$HORODATAGE.dump.age" "s3://$SEAU/" \
            --endpoint-url "$POINT" --only-show-errors
          echo "déposé : mino-$HORODATAGE.dump.age"

      # On relit ce qu'on vient d'écrire. Un dépôt qui rend 0 sur un transfert
      # tronqué existe — et ici on va plus loin que la taille : l'empreinte MD5
      # d'un objet R2 déposé d'un seul tenant est son ETag. On compare donc le
      # fichier distant bit pour bit, pas seulement sa longueur.
      - name: Relire depuis R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SEAU: ${{ secrets.R2_BUCKET }}
        run: |
          CLE="mino-$HORODATAGE.dump.age"
          DISTANTE=$(aws s3api head-object --bucket "$SEAU" --key "$CLE" \
            --endpoint-url "$POINT" --query ContentLength --output text)
          ETAG=$(aws s3api head-object --bucket "$SEAU" --key "$CLE" \
            --endpoint-url "$POINT" --query ETag --output text | tr -d '"')
          LOCALE=$(stat -c%s "$CLE")
          LOCAL_MD5=$(md5sum "$CLE" | cut -d' ' -f1)
          echo "taille locale $LOCALE — distante $DISTANTE"
          if [ "$DISTANTE" != "$LOCALE" ]; then
            echo "::error::Le fichier déposé ne fait pas la même taille que l'original."
            exit 1
          fi
          case "$ETAG" in
            *-*)          echo "dépôt en plusieurs morceaux : empreinte non comparable, taille vérifiée" ;;
            "$LOCAL_MD5") echo "empreinte identique : le fichier distant est bit pour bit le nôtre" ;;
            *)            echo "::error::L'empreinte du fichier distant diffère de l'original."; exit 1 ;;
          esac

      # 30 jours, et pas plus. La politique de confidentialité promet
      # l'effacement des profils enfants « immédiat et définitif » à la
      # suppression d'un compte : une sauvegarde qui vivrait des mois rendrait
      # cette phrase fausse. 30 jours est aussi la plus courte des promesses de
      # conservation, ce qui rend la règle simple à tenir.
      #
      # La purge lit la DATE DANS LE NOM du fichier plutôt que l'horodatage de
      # l'objet : un nom en ISO se compare comme du texte, et il ne ment pas si
      # un objet est un jour recopié ou déplacé.
      - name: Purger au-delà de 30 jours
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SEAU: ${{ secrets.R2_BUCKET }}
        run: |
          # `30 jours au maximum` est une phrase PUBLIÉE, pas un ordre de
          # grandeur. Un `<` strict sur une limite à J-30 garde les jours J-30
          # à J inclus, soit TRENTE ET UN jours — un de trop, tous les jours,
          # sans que rien ne le signale. Le `=` ferme l'écart.
          LIMITE=$(date -u -d '30 days ago' +%Y-%m-%d)
          echo "on retire ce qui date du $LIMITE ou d'avant (30 jours gardés, pas 31)"
          aws s3 ls "s3://$SEAU/" --endpoint-url "$POINT" \
            | awk '{print $4}' | grep '^mino-' | while read -r cle; do
              jour=${cle#mino-}; jour=${jour%%T*}
              if [ "$jour" \< "$LIMITE" ] || [ "$jour" = "$LIMITE" ]; then
                echo "  retiré : $cle"
                aws s3 rm "s3://$SEAU/$cle" --endpoint-url "$POINT" --only-show-errors
              fi
            done

      - name: Compter ce qui reste
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SEAU: ${{ secrets.R2_BUCKET }}
        run: |
          N=$(aws s3 ls "s3://$SEAU/" --endpoint-url "$POINT" | grep -c 'mino-' || true)
          echo "Sauvegardes présentes : $N"
