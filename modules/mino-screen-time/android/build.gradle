// Le module ne fixe aucune version d'Android, et c'est délibéré.
//
// `expo-module-gradle-plugin` est ce qu'appliquent tous les modules d'Expo
// (voir `node_modules/expo-crypto/android/build.gradle`). Il applique
// `kotlin-android`, ajoute `expo-modules-core`, la bibliothèque standard
// Kotlin, et surtout il prend `compileSdk`, `minSdk` et `targetSdk` du projet
// racine — donc de `expo-build-properties` dans `app.json`.
//
// **Le défaut que cela répare.** Ce fichier écrivait `compileSdk 35` en dur.
// Le SDK 57 compile tout en 36 ; une bibliothèque en 35 qui dépend d'une
// bibliothèque en 36 fait échouer Gradle. La partie Android de ce module
// n'avait jamais été compilée — écrite en même temps que la partie iOS, elle
// est passée par Gradle pour la première fois au premier build de production,
// et c'est là qu'elle a refusé.
//
// Un nombre écrit ici serait juste aujourd'hui et faux au prochain SDK, sans
// que rien ne le signale avant le prochain build de production. Ne pas
// l'écrire est le seul moyen qu'il ne devienne jamais faux.

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.mino.screentime'
version = '0.1.0'

/**
 * Ce module n'est pas publié, et il faut le dire.
 *
 * Par défaut le plugin monte une publication Maven — c'est ce dont Expo a
 * besoin pour ses propres modules, distribués sur npm. Cette publication exige
 * un `versionName` dans `defaultConfig`, et son absence faisait échouer la
 * configuration du projet avant même la compilation :
 *
 *   > A problem occurred configuring project ':mino-screen-time'.
 *      > 'android.defaultConfig.versionName' is not defined
 *
 * On pourrait inventer un numéro pour satisfaire la publication. Ce serait un
 * numéro que personne ne lit, que personne ne pense à incrémenter, et qui
 * décrirait un artefact qui n'existe pas : ce module vit dans `modules/`, il
 * est compilé dans l'application et ne part sur aucun dépôt. Dire qu'il n'est
 * pas publiable est la vérité, et fait disparaître l'exigence.
 */
expoModule {
  canBePublished = false
}

android {
  namespace 'app.mino.screentime'
}

dependencies {
  // Le bouclier : lecture de l'application au premier plan, fenêtre par-dessus,
  // sélecteur d'applications. Rien d'autre.
  implementation 'androidx.activity:activity-ktx:1.9.3'
  implementation 'androidx.core:core-ktx:1.13.1'
}
